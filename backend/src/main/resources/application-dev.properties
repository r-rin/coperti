# In-memory H2 wiped on every restart; schema is regenerated from the JPA entities
spring.datasource.url=jdbc:h2:mem:coperti;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=dev_test
spring.datasource.password=dev_password

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Browser console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:coperti)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
