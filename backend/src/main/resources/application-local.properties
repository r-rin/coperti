# In-memory H2 wiped on every restart; schema is regenerated from the JPA entities
spring.datasource.url=jdbc:h2:file:~/.coperti/coperti;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=USERNAME_HERE
spring.datasource.password=PASSWORD_HERE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Browser console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:coperti)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Enable docs
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false